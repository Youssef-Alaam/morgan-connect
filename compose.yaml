services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: morgan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: morgan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U morgan -d morgan']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      # The app connects as its own role; the owner role (morgan) runs migrations and creates it.
      DATABASE_URL: postgres://morgan_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/morgan
      MIGRATION_DATABASE_URL: postgres://morgan:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/morgan
      PORT: '3000'
    # Lets the app reach an engine you run on the host: ENGINE_URL=http://host.docker.internal:8787
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
