services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: morgan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: morgan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U morgan -d morgan']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://morgan:${POSTGRES_PASSWORD}@db:5432/morgan
      PORT: '3000'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
