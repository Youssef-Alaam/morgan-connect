name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # STANDARDS section 12, steps 1-16, in order. Each step is its own named step and the
  # first failure stops the job. Steps 17-18 (restore test, release evals) are not part of M0.
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: 1. Install (npm ci)
        run: npm ci --ignore-scripts
      - name: 2. Commit messages (commitlint)
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx commitlint --from "$FROM_SHA" --to "$TO_SHA"
      - name: 3. Secrets (gitleaks 8.30.1)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner
      - name: 4. PR shape (ticket id, size, test changed, dependency line)
        run: node scripts/check-pr.mjs
      - name: 5. Format
        run: npx prettier --check .
      - name: 6. Lint
        run: npx eslint . --max-warnings 0
      - name: 7. Types
        run: npx tsc --noEmit
      - name: 8. Boundaries
        run: npm run depcruise
      - name: 9. Unused code and dependencies
        run: npx knip
      - name: 10. Licences
        run: npm run licences
      - name: 11. Audit
        run: npm audit --audit-level=high
      - name: 12. Unit tests (with coverage)
        run: npx vitest run --project unit --coverage --coverage.reportsDirectory=coverage/unit
      # No integration tests exist yet (first arrive in M0-4), so this passes with no tests.
      # It becomes real once Postgres-backed tests are added.
      - name: 13. Integration tests (real Postgres; none yet)
        run: >
          npx vitest run --project integration --passWithNoTests
          --coverage --coverage.reportsDirectory=coverage/integration
      # No migrations exist yet, so the minimal script finds no tables and passes.
      - name: 14. Isolation coverage
        run: node scripts/check-isolation-tests.mjs
      # Passes when no src lines changed. Uses every cobertura file the test steps wrote.
      - name: 15. Changed-line coverage (diff-cover, at least 90%)
        run: |
          reports=$(ls coverage/*/cobertura-coverage.xml 2>/dev/null || true)
          if [ -z "$reports" ]; then
            echo "No coverage reports were written (no tests ran); nothing to check."
            exit 0
          fi
          # shellcheck disable=SC2086
          pipx run --spec diff-cover==11.0.4 diff-cover $reports \
            --compare-branch=origin/main --fail-under=90
      # No perf tests exist yet, so this passes with no tests.
      - name: 16. Speed budgets (perf; none yet)
        run: npx vitest run --project perf --passWithNoTests
