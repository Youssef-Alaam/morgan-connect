name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # STANDARDS section 12 steps 1-16, in order; the first failure stops the job.
  ci:
    name: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: 1. Install (npm ci)
        run: npm ci --ignore-scripts
      - name: 2. Commit messages (commitlint)
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx commitlint --from "$FROM_SHA" --to "$TO_SHA"
      - name: 3. Secrets (gitleaks 8.30.1)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gl.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner
      - name: 4. PR shape (ticket id, size, test changed, dependency line)
        run: node scripts/check-pr.mjs
      - name: 5. Format
        run: npx prettier --check .
      - name: 6. Lint
        run: npx eslint . --max-warnings 0
      - name: 7. Types (backend and web)
        run: npm run typecheck
      - name: 7b. Web build
        run: npm run build:web
      # Pinned Chromium, cached by Playwright version (see web/package.json).
      - name: 7c. Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: web
      - name: 7c. Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright-version.outputs.version }}
      - name: 7d. Install Chromium
        # The runner's preinstalled Microsoft apt repo intermittently answers 403 and fails apt update;
        # Chromium does not need it, so drop it and retry the install up to 3 times.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Chromium install attempt $attempt failed"; sleep 10
          done
          exit 1
        working-directory: web
      - name: 7e. Component screenshots and accessibility (light, dark, right-to-left)
        run: npx playwright test
        working-directory: web
      # Real Postgres (Testcontainers) and the real app answering with an echo; sign in, send, reply.
      - name: 7e2. Real-stack smoke (sign in, chat, reply streams in)
        run: npx playwright test -c playwright.stack.config.ts
        working-directory: web
      - name: 7f. Keep the screenshot differences when 7e fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: |
            web/test-results
            web/test-results-stack
          if-no-files-found: ignore
          retention-days: 7
      - name: 8. Boundaries
        run: npm run depcruise
      - name: 9. Unused code and dependencies
        run: npx knip
      - name: 10. Licences
        run: npm run licences && npm run licences:web
      - name: 11. Audit
        run: npm audit --audit-level=high
      - name: 12. Unit tests (with coverage)
        run: npx vitest run --project unit --coverage --coverage.reportsDirectory=coverage/unit
      - name: 13. Integration tests (real Postgres via Testcontainers)
        run: >
          npx vitest run --project integration
          --coverage --coverage.reportsDirectory=coverage/integration
      # Lists each user-data table with its isolation test; fails when one has none.
      - name: 14. Isolation coverage
        run: node scripts/check-isolation-tests.mjs
      # Passes when no src lines changed. Uses every cobertura file the test steps wrote.
      - name: 15. Changed-line coverage (diff-cover, at least 90%)
        run: |
          reports=$(ls coverage/*/cobertura-coverage.xml 2>/dev/null || true)
          if [ -z "$reports" ]; then
            echo "No coverage reports were written (no tests ran); nothing to check."
            exit 0
          fi
          # shellcheck disable=SC2086
          pipx run --spec diff-cover==11.0.4 diff-cover $reports \
            --compare-branch=origin/main --fail-under=90
      # Median turn overhead and typing signal budgets (test/perf).
      - name: 16. Speed budgets (perf)
        run: npx vitest run --project perf

  # A13: an install with only Pi must work. Optional engine SDKs are left out entirely.
  pi-only:
    name: pi-only
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # `npm ci --omit=optional` would also drop the test runner's own platform binaries, so install
      # everything and then remove only this project's declared optional packages (the engine SDKs).
      - name: Install, then remove the project's optional engine SDKs
        run: |
          npm ci --ignore-scripts
          node -e "for (const n of Object.keys(require('./package.json').optionalDependencies ?? {})) require('fs').rmSync('node_modules/' + n, { recursive: true, force: true })"
      - name: No module outside the optional adapter folders imports an optional package
        run: npm run check:optional
      - name: Build
        run: npm run build
      - name: Smoke test (ENGINE=pi on the fake engine answers one message)
        run: npx vitest run --project integration test/integration/pi-only-smoke.test.ts
